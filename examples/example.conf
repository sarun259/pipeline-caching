# Diamond-shaped pipeline: raw feeds both squared and offset, which both
# feed merged. Exercises topological sort on a non-linear DAG, and lets the
# demo show that editing square.py invalidates only squared+merged while
# leaving raw and offset cached.
raw []                   "python3 scripts/gen_numbers.py {OUTPUT}"                 scripts/gen_numbers.py
squared [raw]            "python3 scripts/square.py {INPUT1} {OUTPUT}"             scripts/square.py
offset [raw]             "python3 scripts/add_offset.py {INPUT1} {OUTPUT}"         scripts/add_offset.py
merged [squared,offset]  "python3 scripts/merge_sum.py {INPUT1} {INPUT2} {OUTPUT}" scripts/merge_sum.py
